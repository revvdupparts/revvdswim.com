<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVVDSWIM | Car Decals & Hoodies</title>
<meta name="description" content="Premium car decals and hoodies. Built for the culture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --panel:#141414; --line:#262626;
    --text:#f5f5f5; --muted:#9a9a9a; --accent:#e10600;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}

  /* NAV */
  header{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-weight:800;letter-spacing:.2em;font-size:15px}
  .links{display:flex;gap:28px;font-size:14px;color:var(--muted)}
  .links a:hover{color:var(--text)}
  .btn{display:inline-block;padding:12px 26px;border-radius:999px;font-weight:600;font-size:14px;transition:.2s;border:1px solid transparent;cursor:pointer}
  .btn-light{background:var(--text);color:#000}
  .btn-light:hover{background:#ccc}
  .btn-ghost{border-color:#444;color:var(--text);background:transparent}
  .btn-ghost:hover{border-color:var(--text)}
  .menu-btn{display:none;background:none;border:0;color:var(--text);font-size:24px;cursor:pointer}

  /* HERO */
  .hero{min-height:88vh;display:flex;align-items:flex-end;padding-bottom:80px;
    background:radial-gradient(ellipse at 70% 30%,rgba(225,6,0,.25),transparent 55%),
               linear-gradient(180deg,#000 0%,#111 100%);position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background:url('images/hero.jpg') center/cover;opacity:.35;z-index:0}
  .hero .wrap{position:relative;z-index:1}
  .eyebrow{font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
  .hero h1{font-size:clamp(44px,8vw,104px);font-weight:800;line-height:.95;letter-spacing:-.03em;max-width:900px}
  .hero p{color:var(--muted);font-size:18px;max-width:520px;margin:22px 0 32px}
  .row{display:flex;gap:12px;flex-wrap:wrap}

  /* SECTIONS */
  section{padding:96px 0}
  .head{display:flex;justify-content:space-between;align-items:end;margin-bottom:40px;gap:20px;flex-wrap:wrap}
  h2{font-size:clamp(32px,4.5vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .sub{color:var(--muted);max-width:460px}

  /* CATEGORY TILES */
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cat{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
  .cat img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .cat:hover img{transform:scale(1.04)}
  .cat .label{position:absolute;left:24px;bottom:24px;right:24px;display:flex;justify-content:space-between;align-items:end}
  .cat h3{font-size:28px;font-weight:800}
  .cat span{color:var(--muted);font-size:14px}

  /* FILTER */
  .filters{display:flex;gap:8px;margin-bottom:28px}
